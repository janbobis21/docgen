<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32-C3 Control Panel</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --primary-off: #ef4444;
            --primary-on: #22c55e;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background-color: var(--card-bg);
            padding: 2rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 0.875rem;
            margin-bottom: 2rem;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
        }

        .btn {
            background-color: #334155;
            color: white;
            border: none;
            padding: 1.5rem 1rem;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
        }

        .btn:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn.active {
            background-color: var(--primary-on);
            box-shadow: 0 0 15px rgba(34, 197, 94, 0.4);
        }

        .status-dot {
            width: 10px;
            height: 10px;
            background-color: var(--primary-off);
            border-radius: 50%;
            transition: background-color 0.2s;
        }

        .btn.active .status-dot {
            background-color: white;
        }

        .log-box {
            margin-top: 1.5rem;
            padding: 0.75rem;
            background-color: #0f172a;
            border-radius: 8px;
            font-family: monospace;
            font-size: 0.75rem;
            color: #38bdf8;
            max-height: 60px;
            overflow-y: auto;
            text-align: left;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>ESP32-C3 Supermini</h1>
        <div class="subtitle">Device: esp32_c3_supermini_1</div>

        <div class="grid">
            <button class="btn" id="pin1" onclick="togglePin('pin1')">
                <div class="status-dot"></div>
                Pin 1
            </button>
            <button class="btn" id="pin2" onclick="togglePin('pin2')">
                <div class="status-dot"></div>
                Pin 2
            </button>
            <button class="btn" id="pin3" onclick="togglePin('pin3')">
                <div class="status-dot"></div>
                Pin 3
            </button>
            <button class="btn" id="pin4" onclick="togglePin('pin4')">
                <div class="status-dot"></div>
                Pin 4
            </button>
        </div>

        <div class="log-box" id="log">System ready. Click a button to toggle.</div>
    </div>

    <script>
        // Configuration
        const TOKEN = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJkZXYiOiJlc3AzMl9jM19zdXBlcm1pbmlfMSIsImlhdCI6MTc4ODYwMjE1NCwianRpIjoiNmE5YmU3MmE4ZGRhYjliMjBlMDM5ZGRlIiwic3ZyIjoiYXAtc291dGhlYXN0LmF3cy50aGluZ2VyLmlvIiwidXNyIjoiamFuYm9iaXMifQ.uXCb3o2Knwxyhgg8ollZiC35NkSsN0B64QjtWX1ekig";
        const BASE_URL = "https://backend.thinger.io/v3/users/janbobis/devices/esp32_c3_supermini_1/resources/";

        // Object to keep track of the local state for each pin
        const pinStates = {
            pin1: false,
            pin2: false,
            pin3: false,
            pin4: false
        };

        async function togglePin(pinId) {
            const button = document.getElementById(pinId);
            const logBox = document.getElementById('log');
            
            // Toggle the local target state
            const targetState = !pinStates[pinId];
            
            logBox.innerText = `Sending ${targetState} to ${pinId}...`;
            button.style.pointerEvents = 'none'; // Disable clicking during request

            try {
                const response = await fetch(`${BASE_URL}${pinId}`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${TOKEN}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ in: targetState }) 
                    // Note: Thinger.io payloads often expect wrapper formats like { "in": true } or a raw boolean. 
                    // If your device code expects a raw JSON boolean, change this line to: body: JSON.stringify(targetState)
                });

                if (response.ok) {
                    // Update state and UI on success
                    pinStates[pinId] = targetState;
                    if (targetState) {
                        button.classList.add('active');
                    } else {
                        button.classList.remove('active');
                    }
                    logBox.innerText = `Success: ${pinId} turned ${targetState ? 'ON' : 'OFF'}`;
                } else {
                    logBox.innerText = `Error: HTTP ${response.status}`;
                }
            } catch (error) {
                logBox.innerText = `Network Error: ${error.message}`;
            } finally {
                button.style.pointerEvents = 'auto'; // Re-enable clicking
            }
        }
    </script>
</body>
</html>
